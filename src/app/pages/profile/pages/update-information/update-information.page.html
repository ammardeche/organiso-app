<ion-content class="ion-padding">
  <h2 class="text-xl font-bold mb-4">Update Profile</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="text-sm font-medium">Full Name</label>
      <input
        formControlName="fullName"
        type="text"
        class="w-full bg-gray-100 p-3 rounded-xl"
        placeholder="Enter your full name"
      />
    </div>

    <div>
      <label class="text-sm font-medium">Email Address</label>
      <input
        formControlName="email"
        type="email"
        class="w-full bg-gray-100 p-3 rounded-xl"
        placeholder="Enter your email"
      />
    </div>

    <div class="flex gap-3 pt-4">
      <button
        type="submit"
        class="!flex-1 !bg-black !text-white !p-3 !rounded-xl !font-semibold"
        [disabled]="form.invalid"
      >
        Save
      </button>

      <button
        type="button"
        class="!flex-1 !bg-gray-200 !text-gray-800 !p-3 !rounded-xl !font-medium"
        (click)="close()"
      >
        Cancel
      </button>
    </div>
  </form>
</ion-content>
