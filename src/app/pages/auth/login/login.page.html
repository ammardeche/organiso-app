<ion-header class="ion-no-border" [collapse]="'fade'">
  <app-header title="login"></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding h-screen">
  <!-- effects -->

  <img
    class="absolute top-0 right-0 w-[400px]"
    src="/assets/effects/Ellipse-yellow.png"
    alt=""
  />

  <img
    class="absolute top-0 left-0 w-[400px]"
    src="/assets/effects/Ellipse-green.png"
    alt=""
  />

  <img
    class="absolute top-10 right-0 w-[300px]"
    src="/assets/effects/Ellipse-violet.png"
    alt=""
  />

  <div class="pt-20 gap-1.5 h-full relative">
    <!-- sign in with google -->
    <button
      class="row-center-center gap-1.5 bg-gray-200 w-full !py-3.5 !rounded-lg"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20px"
        height="20px"
        viewBox="-3 0 262 262"
        preserveAspectRatio="xMidYMid"
      >
        <path
          d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027"
          fill="#4285F4"
        />
        <path
          d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1"
          fill="#34A853"
        />
        <path
          d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782"
          fill="#FBBC05"
        />
        <path
          d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251"
          fill="#EB4335"
        />
      </svg>
      <a class="!text-black">Sign In with google</a>
    </button>

    <div class="flex items-center w-full my-4">
      <div class="flex-1 h-px bg-gray-400"></div>
      <span class="px-3 text-black text-sm">or sign in with</span>
      <div class="flex-1 h-px bg-gray-400"></div>
    </div>

    <!-- form -->

    <form [formGroup]="form" class="!mt-[20px]">
      <!-- email input -->
      <div class="form-group">
        <label for="email">Email Adress</label>
        <div class="input-wrapper">
          <input
            placeholder="Enter your email"
            name="email"
            id="email"
            formControlName="email"
            validate
          />
        </div>
      </div>

      <!-- password input -->
      <div class="form-group relative">
        <label for="password" class="!row-between-center">
          <div>Password</div>
          <a
            [routerLink]="['/reset-password']"
            class="!text-blue-500 text-xs font-normal leading-[155%]"
            >Forgot password?</a
          >
        </label>
        <div class="input-wrapper">
          <input
            placeholder="Enter your password"
            [type]="passwordVisibility['password'] ? 'text' : 'password'"
            name="password"
            id="password"
            formControlName="password"
            validate
          />
          <!-- eye icon placeholder -->
          <div
            class="password absolute bottom-1/5 right-3"
            (click)="togglePassword('password')"
          >
            @if (passwordVisibility['password'] ) {
            <svg
              width="17"
              height="14"
              viewBox="0 0 17 14"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path

                fill="#818898"
              />
            </svg>
            } @else{
            <svg
              width="18"
              height="14"
              viewBox="0 0 18 14"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9.00049 0C12.0796 0.000161207 15.0184 1.81862 17.1138 5.15918C17.819 6.28382 17.819 7.71618 17.1138 8.84082C15.0184 12.1814 12.0796 13.9998 9.00049 14C5.92124 14 2.98266 12.1814 0.887207 8.84082C0.181865 7.71609 0.181866 6.28391 0.887207 5.15918C2.98266 1.81859 5.92124 -1.19207e-07 9.00049 0ZM9.00049 2C6.77502 2 4.40863 3.30893 2.58154 6.22168C2.28366 6.69664 2.28366 7.30336 2.58154 7.77832C4.40863 10.6911 6.77502 12 9.00049 12C11.2259 11.9998 13.5924 10.691 15.4194 7.77832C15.7172 7.30345 15.7172 6.69655 15.4194 6.22168C13.5924 3.30898 11.2259 2.00016 9.00049 2ZM9.00049 3C11.2094 3.00022 13.0005 4.791 13.0005 7C13.0005 9.209 11.2094 10.9998 9.00049 11C6.79135 11 5.00049 9.20914 5.00049 7C5.00049 4.79086 6.79135 3 9.00049 3ZM8.91455 5.00391C8.96906 5.15933 9.00049 5.32596 9.00049 5.5C9.00049 6.32829 8.32873 6.99978 7.50049 7C7.32654 7 7.15975 6.96852 7.00439 6.91406C7.00319 6.94259 7.00049 6.97117 7.00049 7C7.00049 8.10457 7.89592 9 9.00049 9C10.1049 8.99978 11.0005 8.10443 11.0005 7C11.0005 5.89557 10.1049 5.00022 9.00049 5C8.9718 5 8.94294 5.00271 8.91455 5.00391Z"
                fill="#818898"
              />
            </svg>

            }
          </div>
        </div>
      </div>

      <div class="row-between-center mt-3">
        <label class="flex items-center space-x-2 cursor-pointer select-none">
          <!-- Custom checkbox -->
          <div
            (click)="rememberMe = !rememberMe"
            [class.bg-green-500]="rememberMe"
            class="w-5 h-5 border-1 border-gray rounded-[6px] row-center-center transition-colors duration-200"
          >
            <!-- Checkmark -->
            @if (rememberMe) {
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="0.5"
                y="0.5"
                width="19"
                height="19"
                rx="5.5"
                fill="#0BB262"
              />
              <rect
                x="0.5"
                y="0.5"
                width="19"
                height="19"
                rx="5.5"
                stroke="#0BB262"
              />
              <path
                d="M14.6666 6.5L8.24992 12.9167L5.33325 10"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            }
          </div>

          <!-- Label -->
          <span class="text-black">Remember me</span>
        </label>
      </div>

      <button class="btn-primary">Login</button>
    </form>

    <div class="font-normal text-center mt-6">
      <p>
        Don't have an account?
        <span [routerLink]="['/register']" class="text-blue-500"
          >Sign up here</span
        >
      </p>
    </div>
  </div>
</ion-content>
