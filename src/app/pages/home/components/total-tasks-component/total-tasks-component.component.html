<div class="row-between-center bg-primary px-4 py-4 rounded-xl">
  <div class="col">
    @if (progress()>0) {
    <div class="text-lg text-white">
      Your today’s task <br />
      almost done!
    </div>
    } @else {
    <div class="text-lg text-white">
      you have no task <br />
      for today
    </div>
    }

    <button
      class="px-3 !font-medium !py-3 !text-primary !rounded-xl bg-gray-200 mt-4"
    >
      View tasks
    </button>
  </div>
  <div class="progress-container">
    <svg viewBox="0 0 36 36" class="circular-chart">
      <path
        class="circle-bg"
        d="M18 2.0845
         a 15.9155 15.9155 0 0 1 0 31.831
         a 15.9155 15.9155 0 0 1 0 -31.831"
      />
      <path
        class="circle"
        [attr.stroke-dasharray]="progress() + ', 100'"
        d="M18 2.0845
         a 15.9155 15.9155 0 0 1 0 31.831
         a 15.9155 15.9155 0 0 1 0 -31.831"
      />
      <text x="18" y="21" class="percentage">{{ progress() }}%</text>
    </svg>
  </div>
</div>
