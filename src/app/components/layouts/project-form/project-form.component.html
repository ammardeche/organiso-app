<form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Task Group -->
  <div
    class="rounded-3xl bg-white px-5 py-4 shadow-[0_10px_40px_rgba(0,0,0,0.06)] flex items-center justify-between"
  >
    <div class="row-center-center gap-2">
      <div>he</div>
      <ion-list>
        <ion-item>
          <ion-select
            aria-label="Fruit"
            interface="popover"
            placeholder="Select fruit"
          >
            <ion-select-option value="apples">Apples</ion-select-option>
            <ion-select-option value="oranges">Oranges</ion-select-option>
            <ion-select-option value="bananas">Bananas</ion-select-option>
          </ion-select>
        </ion-item>
      </ion-list>
    </div>

    <!-- TODO: dropdown icon -->
    <div
      class="h-8 w-8 rounded-full bg-gray-100 flex items-center justify-center"
    ></div>
  </div>

  <!-- Project Name -->
  <div
    class="rounded-3xl bg-white px-5 py-4 shadow-[0_10px_40px_rgba(0,0,0,0.06)]"
  >
    <span class="text-xs text-gray-400 block mb-1">Project Name</span>
    <input
      type="text"
      formControlName="name"
      class="w-full bg-transparent outline-none text-sm font-semibold"
    />
  </div>

  <!-- Description -->
  <div
    class="rounded-3xl bg-white px-5 py-4 shadow-[0_10px_40px_rgba(0,0,0,0.06)]"
  >
    <span class="text-xs text-gray-400 block mb-1">Description</span>
    <textarea
      rows="4"
      formControlName="description"
      class="w-full bg-transparent outline-none text-sm text-gray-700"
    ></textarea>
  </div>

  <!-- Start Date -->
  <div
    class="rounded-3xl bg-white px-5 py-4 shadow-[0_10px_40px_rgba(0,0,0,0.06)] flex items-center justify-between"
  >
    <div class="flex items-center gap-3">
      <div
        class="h-10 w-10 rounded-2xl bg-purple-100 flex items-center justify-center"
      >
        <!-- TODO: calendar icon -->
      </div>
      <div class="flex flex-col">
        <span class="text-xs text-gray-400">Start Date</span>
        <input
          type="text"
          formControlName="startDate"
          class="mt-1 bg-transparent outline-none text-sm font-semibold"
        />
      </div>
    </div>

    <!-- TODO: dropdown icon -->
    <div
      class="h-8 w-8 rounded-full bg-gray-100 flex items-center justify-center"
    >
      <!-- icon -->
    </div>
  </div>

  <!-- End Date -->
  <div
    class="rounded-3xl bg-white px-5 py-4 shadow-[0_10px_40px_rgba(0,0,0,0.06)] flex items-center justify-between"
  >
    <div class="flex items-center gap-3">
      <div
        class="h-10 w-10 rounded-2xl bg-purple-100 flex items-center justify-center"
      >
        <!-- TODO: calendar icon -->
      </div>
      <div class="flex flex-col">
        <span class="text-xs text-gray-400">End Date</span>
        <input
          type="text"
          formControlName="endDate"
          class="mt-1 bg-transparent outline-none text-sm font-semibold"
        />
      </div>
    </div>

    <!-- TODO: dropdown icon -->
    <div
      class="h-8 w-8 rounded-full bg-gray-100 flex items-center justify-center"
    >
      <!-- icon -->
    </div>
  </div>

  <!-- Status buttons (using formValue() signal) -->
  <div class="flex items-center justify-center gap-3 mt-2 text-xs">
    <button
      type="button"
      class="rounded-full border px-5 py-1"
      [class.bg-black]="formValue().status === 'todo'"
      [class.text-white]="formValue().status === 'todo'"
    >
      To-Do
    </button>

    <button
      type="button"
      class="rounded-full border px-5 py-1"
      [class.bg-black]="formValue().status === 'done'"
      [class.text-white]="formValue().status === 'done'"
    >
      Done
    </button>

    <button
      type="button"
      class="rounded-full border px-5 py-1"
      [class.bg-black]="formValue().status === 'inprogress'"
      [class.text-white]="formValue().status === 'inprogress'"
    >
      InProgress
    </button>
  </div>

  <!-- Submit -->
  <button
    type="submit"
    [disabled]="form.invalid"
    class="mt-4 w-full rounded-3xl bg-purple-600 py-4 text-center text-white text-base font-semibold disabled:opacity-50"
  >
    {{ submitLabel() }}
  </button>
</form>

<!-- (click)="setStatus('inprogress')" -->
